name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend_test/**'
      - '.github/workflows/frontend_ci.yml'

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen
        uses: docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend-html:latest./frontend_test

      - name: Validar configuración de nginx
        run: docker run --rm --add-host backend:127.0.0.1 ${{ secrets.DOCKER_USERNAME }}/frontend-html:latest nginx -target

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Publicar imagen en Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/frontend-html:latest